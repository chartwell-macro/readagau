# Build documentation for every pull request and branch push.  The Pages
# deployment job is gated by the repository-provided default branch name so
# this workflow never guesses whether the default is `main` or `master`.
name: pkgdown

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::pkgdown, any::rmarkdown, local::.

      - name: Render README.Rmd
        shell: bash
        run: |
          if [[ ! -f README.Rmd ]]; then
            echo "::error::README.Rmd is required as the source of README.md"
            exit 1
          fi
          Rscript --vanilla -e 'rmarkdown::render("README.Rmd", output_file = "README.md", clean = TRUE, quiet = TRUE)'

      - name: Check pkgdown configuration
        run: Rscript --vanilla -e 'pkgdown::check_pkgdown()'

      - name: Build pkgdown site
        run: >-
          Rscript --vanilla -e
          'pkgdown::build_site_github_pages(dest_dir = "site", clean = TRUE,
          install = FALSE, new_process = TRUE)'

      - name: Smoke-test generated site
        shell: bash
        run: |
          test -s site/index.html
          test -s site/reference/index.html
          test -s site/articles/index.html
          test -s site/news/index.html
          if rg -n 'weekly-prices-fertiliser-rights|Error in|Warning message' site; then
            echo "::error::Generated site contains stale content or a rendered warning"
            exit 1
          fi

      - name: Upload site for Pages job
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: site
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: pkgdown-site
          path: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
